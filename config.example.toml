[server]
host = "127.0.0.1"
port = 8765
public_base_url = "https://mods.example.com"
threads = 16
connection_limit = 200
channel_timeout = 120
max_downloads_per_ip = 2
# Set to 1 only when one local reverse proxy is used and port 8765 is private.
trusted_proxy_hops = 1
# Enable only with the matching Nginx internal location from the README.
x_accel_redirect_prefix = ""

[security]
admin_password = "replace-with-a-long-random-token"
admin_token = "cs.rin.ru"
# Key that encrypts community Steam logins in the database. Leave empty to
# auto-generate data/credentials.key on first start (back that file up!).
credentials_key = ""

[steam]
# Optional. Account libraries are read from the Steam login with SteamCMD.
# The Web API key is only a fallback when that returns no licences.
web_api_key = ""

# Optional. Accounts listed here are imported once into the account pool
# (database) on startup and can then be removed from this file. New accounts
# are normally added by users on the website.
[[steam.accounts]]
name = "main"
username = "your-steam-login"
password = "your-steam-password"
guard_code = ""
steam_id = ""

[[steam.accounts]]
name = "extra1"
username = "your-steam-login"
password = "your-steam-password"
guard_code = ""
steam_id = ""

[steam.windows]
steamcmd_path = "SteamCMD/steamcmd.exe"

[steam.linux]
steamcmd_path = "steamcmd"

[storage]
data_dir = "data"
database_path = "data/jobs.sqlite3"
archive_dir = "data/archives"
file_ttl_hours = 24

[worker]
max_queue_size = 100
max_archive_gb = 25
poll_seconds = 1.0

[accounts]
# Working accounts are re-validated with SteamCMD this often.
check_interval_minutes = 15
# Broken accounts are retried less often in case they were fixed.
broken_recheck_minutes = 360
# Maximum submitted accounts waiting for their first validation.
max_pending = 25
# Kill a SteamCMD login that hangs (e.g. waiting for phone approval).
login_timeout_seconds = 120
# Store lookups per check when scanning a new library (Store rate limit).
max_store_lookups_per_check = 60

[[games]]
name = "Euro Truck Simulator 2"
app_id = 227300
enabled = true

[[games]]
name = "American Truck Simulator"
app_id = 270880
enabled = true
