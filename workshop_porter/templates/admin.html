<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Account Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="container-shell">
      <div>
        <h1>Account admin <small>workshop downloader</small></h1>
      </div>
      <div class="topbar-right">
        <a class="admin-link" href="/">Back to downloader</a>
      </div>
    </div>
  </header>

  <main class="container-shell admin-shell">
    <div class="stat-row" id="stats">
      <div class="stat"><span class="stat-value" id="statWorking">–</span><span class="stat-label">working</span></div>
      <div class="stat"><span class="stat-value" id="statBroken">–</span><span class="stat-label">broken</span></div>
      <div class="stat"><span class="stat-value" id="statPending">–</span><span class="stat-label">validating</span></div>
      <div class="stat"><span class="stat-value" id="statDisabled">–</span><span class="stat-label">disabled</span></div>
      <div class="stat"><span class="stat-value" id="statGames">–</span><span class="stat-label">games covered</span></div>
    </div>

    <section class="forum-panel" aria-labelledby="accounts-title">
      <div class="panel-title">
        <h2 id="accounts-title">Steam accounts</h2>
        <div class="filter-tabs" role="tablist" id="filterTabs">
          <button type="button" data-filter="all" class="active">All</button>
          <button type="button" data-filter="working">Working</button>
          <button type="button" data-filter="broken">Broken</button>
          <button type="button" data-filter="pending">Validating</button>
          <button type="button" data-filter="disabled">Disabled</button>
        </div>
      </div>
      <div class="table-scroll">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Name / login</th>
              <th>Status</th>
              <th>Games</th>
              <th>Checks</th>
              <th class="actions-col">Actions</th>
            </tr>
          </thead>
          <tbody id="accountRows"></tbody>
        </table>
      </div>
      <div id="adminEmpty" class="empty-state" hidden>No accounts match this filter.</div>
      <div id="adminMessage" class="form-message admin-message" role="status" aria-live="polite"></div>
    </section>

    <section class="forum-panel" aria-labelledby="coverage-title">
      <div class="panel-title">
        <h2 id="coverage-title">Game coverage</h2>
        <span id="intervalNote"></span>
      </div>
      <table class="pool-table"><tbody id="coverageRows"></tbody></table>
    </section>
  </main>

  <script src="{{ url_for('static', filename='admin.js') }}" defer></script>
</body>
</html>
